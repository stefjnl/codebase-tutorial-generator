version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: final-api
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./samples:/samples
      - ./output:/output
    entrypoint: [ "dotnet", "DotNetTutorialGenerator.Api.dll" ]

  console:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: final-console
    volumes:
      - ./samples:/samples
      - ./output:/output
    entrypoint: [ "dotnet", "DotNetTutorialGenerator.Console.dll" ]
