version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final-api
    ports:
      - "8082:80" # Changed to avoid conflict with Blazor
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./samples:/samples
      - ./output:/output
    entrypoint: [ "dotnet", "DotNetTutorialGenerator.Api.dll" ]

  console:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final-console
    volumes:
      - ./samples:/samples
      - ./output:/output
    entrypoint: [ "dotnet", "DotNetTutorialGenerator.Console.dll" ]

  blazor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final-blazor
    ports:
      - "8081:8080" # Host 8081 -> Container 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./samples:/samples
      - ./output:/output
    entrypoint: [ "dotnet", "DotNetTutorialGenerator.Blazor.dll" ]
